name: Aktualizuj plan i publikuj
run-name: "Aktualizuj plan (${{ github.event_name }}, próba ${{ inputs.attempt || 1 }})"

on:
  schedule:
    - cron: "17 */3 * * *"   # co 3 godziny (UTC)
  workflow_dispatch:         # ręczne uruchomienie z zakładki Actions
    inputs:
      attempt:
        description: "Numer próby (ustawiane automatycznie przy ponowieniu po nieudanym pobraniu)"
        default: "1"
  push:
    branches: [main]

env:
  MAX_ATTEMPTS: 5   # edupage ucina połączenia z części adresów IP runnerów GitHuba; każdy nowy job = nowa maszyna = nowe IP

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write   # do ponownego uruchomienia workflow na innym runnerze

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: IP runnera (do diagnozy blokady edupage)
        if: github.event_name != 'push'
        run: |
          echo "Publiczne IP tej maszyny = $(curl -sS --max-time 10 https://api.ipify.org || echo nieznane)"
      - name: Pobierz plan (edupage + cku.home.pl)
        id: scrape
        if: github.event_name != 'push'   # push tylko wdraża stronę — źródeł nie odpytujemy
        continue-on-error: true   # gdy źródła nie odpowiadają, publikujemy ostatni zapisany plan
        run: |
          set -o pipefail
          EDU_DEBUG=${{ github.event_name == 'workflow_dispatch' && (inputs.attempt || '1') == '1' && '1' || '' }} node scrape.js 2>&1 | tee scrape.log
      - name: Ostrzeżenie o nieudanym pobieraniu
        if: steps.scrape.outcome == 'failure'
        run: echo "::warning::Nie udało się pobrać planu (próba ${{ inputs.attempt || 1 }}/${{ env.MAX_ATTEMPTS }}) — opublikowano ostatnie zapisane dane."
      - name: Ponów na innym runnerze (inne IP)
        if: steps.scrape.outcome == 'failure' && fromJSON(inputs.attempt || '1') < fromJSON(env.MAX_ATTEMPTS)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          next=$(( ${{ inputs.attempt || 1 }} + 1 ))
          echo "Pobieranie nie powiodło się — uruchamiam próbę $next na nowej maszynie."
          gh workflow run update.yml --ref "${{ github.ref_name }}" -f attempt="$next"
      - name: Zapisz zmiany w danych
        run: |
          git config user.name "plan-bot"
          git config user.email "plan-bot@users.noreply.github.com"
          git add schedule.js schedule.json
          git diff --cached --quiet || git commit -m "Aktualizacja planu $(date -u +%F\ %H:%M) UTC"
          git push || true
      - name: Zbierz pliki strony
        run: |
          mkdir _site
          cp index.html data.js schedule.js schedule.json manifest.webmanifest sw.js _site/
          cp -r icons _site/icons
          cp scrape.log _site/scrape.log 2>/dev/null || echo "brak logu (scraper nie uruchamiany)" > _site/scrape.log
          # czas ostatniego udanego sprawdzenia źródeł; przy pushu / awarii zachowujemy poprzednią wartość z działającej strony
          if [ "${{ steps.scrape.outcome }}" = "success" ]; then
            echo "window.CHECKED_AT = \"$(date -u +%FT%TZ)\";" > _site/checked.js
          else
            curl -sf https://aszarnecki.github.io/plan-lekcji/checked.js -o _site/checked.js || echo "window.CHECKED_AT = null;" > _site/checked.js
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
